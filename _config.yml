# ---------------------------------------------------------------
# Site settings — edit these first
# ---------------------------------------------------------------
title: AISy Lab
tagline: AI Security & Interpretability
description: >-
  AISy Lab studies how modern AI systems work on the inside, how they can be
  attacked, and how to make them safer and more transparent.

# For a project site (github.com/your-org/aisy-lab) keep baseurl "/aisy-lab".
# For a user/org site (your-org.github.io) or a custom domain, set baseurl to "".
url: "https://home.aisylab.com"
baseurl: ""

# Lab details (shown in the footer and on the home page)
affiliation: Faculty of Electrical Engineering and Computing, University of Zagreb
address: Unska 3, 10000 Zagreb, Croatia
email:                      # lab email, or leave empty
github:                     # GitHub user/org name, or leave empty
twitter:                    # optional, without @

# Top navigation
nav:
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publications/
  - title: People
    url: /people/

# ---------------------------------------------------------------
# Build settings — usually no need to touch
# ---------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
