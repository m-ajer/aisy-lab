# Research areas. `id` is what projects and publications refer to in their `areas:` list.
# `color` tints the tags and cards for that area.

- id: interpretability
  name: Mechanistic Interpretability
  short: Interpretability
  color: "#6d5bd0"
  description: >-
    Reverse-engineering the internal circuits and representations of neural
    networks to explain what they compute and why.

- id: robustness
  name: Adversarial Robustness
  short: Robustness
  color: "#d0543b"
  description: >-
    Understanding jailbreaks, prompt injection and adversarial inputs, and
    building models and defenses that hold up under attack.

- id: privacy
  name: Privacy & Data Leakage
  short: Privacy
  color: "#1f8a70"
  description: >-
    Measuring what models memorize and reveal about their training data, and
    methods that limit that leakage.

- id: evaluation
  name: Auditing & Evaluation
  short: Evaluation
  color: "#c48a12"
  description: >-
    Benchmarks, red-teaming protocols and auditing tools that make claims about
    model safety testable.
