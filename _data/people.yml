# Lab members, grouped. Groups appear on the People page in this order.
#
# Member fields (all optional except name):
#   name, role, photo (path under /assets/img/people/ or full URL), interests,
#   website, email, scholar (URL), github (username), linkedin (URL),
#   now (alumni only: where they went)
#   projects  list of project slugs from _projects/ (file name without .md),
#             e.g. [lada], shown as links on their card
#
# Anyone listed here is automatically highlighted in publication author lists,
# so write names exactly as they appear in _data/publications.yml.
#
# Set `style: list` for a compact text list instead of photo cards (good for alumni).

