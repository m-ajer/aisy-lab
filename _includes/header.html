<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo-small.png' | relative_url }}" alt="{{ site.title }} home" width="40" height="40">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
