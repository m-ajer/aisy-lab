<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <strong>{{ site.title }}</strong> · {{ site.tagline }}<br>
      <span class="muted">{{ site.affiliation }}</span><br>
      <span class="muted">{{ site.address }}</span>
    </div>
    <div class="footer-links">
      {% if site.email %}<a href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif %}
      {% if site.twitter %}<a href="https://x.com/{{ site.twitter }}">X / Twitter</a>{% endif %}
    </div>
  </div>
</footer>
